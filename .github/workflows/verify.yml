name: Verify applications
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: apps
        name: Inventory standalone projects
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const projects = [];
          for (const track of fs.readdirSync('apps')) {
            for (const slug of fs.readdirSync(`apps/${track}`)) {
              const dir = `apps/${track}/${slug}`;
              if (fs.existsSync(`${dir}/package-lock.json`)) projects.push(dir);
            }
          }
          if (!projects.length || projects.length > 30) throw new Error('Unexpected app inventory');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({project: projects})}\n`);
          JS
  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Canonical security headers (vercel.json)
        run: node tools/check-headers.mjs
      - name: Frozen helper copies and LICENSE files
        run: node tools/check-duplicates.mjs
      - name: Documentation consistency
        run: node tools/check-docs.mjs
      - name: Dist token scanner self-test
        run: node tools/check-dist.mjs --self-test
  verify:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Built output hygiene (check-dist)
        working-directory: ${{ github.workspace }}
        env:
          PROJECT: ${{ matrix.project }}
        run: node tools/check-dist.mjs --require-built --app "$PROJECT"
